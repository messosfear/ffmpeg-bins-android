name: Build FFmpeg for Android aarch64

on:
  workflow_dispatch: {}

jobs:
  build-ffmpeg-arm64:
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r25b
      ANDROID_API: "21"  # min API for arm64. Change if needed.
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            autoconf automake build-essential cmake pkg-config \
            yasm nasm git wget unzip libtool make

      - name: Download Android NDK
        run: |
          set -euo pipefail
          NDK_ZIP="android-ndk-${NDK_VERSION}-linux.zip"
          NDK_URL="https://dl.google.com/android/repository/${NDK_ZIP}"
          mkdir -p "${HOME}/android-ndk"
          if [ ! -d "${HOME}/android-ndk/android-ndk-${NDK_VERSION}" ]; then
            wget -q --show-progress "${NDK_URL}"
            unzip -q "${NDK_ZIP}" -d "${HOME}/android-ndk"
            rm "${NDK_ZIP}"
          fi
          echo "NDK at ${HOME}/android-ndk/android-ndk-${NDK_VERSION}"
        shell: bash

      - name: Build FFmpeg (Android aarch64)
        run: |
          chmod +x scripts/build-ffmpeg-android.sh
          scripts/build-ffmpeg-android.sh \
            --ndk "${HOME}/android-ndk/android-ndk-${NDK_VERSION}" \
            --api "${ANDROID_API}"
        shell: bash
        env:
          # allow script to use more CPU cores
          MAKEFLAGS: "-j$(nproc)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ffmpeg-android-aarch64
          path: android-aarch64/bin/ffmpeg
